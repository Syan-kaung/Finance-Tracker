<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <button id="installAppBtn" class="icon-btn" title="Install App"><i class="fas fa-download"></i></button>
        <button id="settingsBtn" class="icon-btn premium-icon" title="Settings"><i class="fas fa-cog"></i></button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
        <h3 id="strSettingsTitle">Settings / ဆက်တင်များ</h3>
        
        <label><i class="fas fa-globe"></i> Language</label>
        <select id="languageSelect">
            <option value="my">မြန်မာ (Myanmar)</option>
            <option value="en">English</option>
            <option value="ja">日本語 (Japanese)</option>
        </select>

        <label><i class="fas fa-moon"></i> Dark Mode</label>
        <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider round"></span>
        </label>

        <label><i class="fas fa-palette"></i> Theme Color</label>
        <select id="themeSelect">
            <option value="default">Default Soft</option>
            <option value="gold">Premium Gold</option>
            <option value="silver">Sleek Silver</option>
            <option value="crazy">Crazy Neon</option>
            <option value="glazy">Glazy Glass</option>
        </select>

        <label><i class="fas fa-image"></i> Custom Background</label>
        <input type="file" id="bgUpload" accept="image/*">

        <label><i class="fas fa-bell"></i> Low Balance Warning</label>
        <div class="warning-settings">
            <label class="switch">
                <input type="checkbox" id="warningToggle">
                <span class="slider round"></span>
            </label>
            <input type="number" id="warningAmount" placeholder="Amount (e.g. 5000)">
        </div>
        <button id="closeSettings" class="btn-primary">Close</button>
    </div>

    <div class="container main-app">
        <h1 id="appTitle" contenteditable="true" class="editable-text">အမည်နှင့် ကိုယ်ရေးကိုယ်တာငွေစာရင်း</h1>
        
        <p id="motivationText" contenteditable="true" class="editable-text motivation">အနာဂတ်အတွက် ယနေ့ပဲ စုဆောင်းလိုက်ပါ!</p>

        <div class="balance-card">
            <h2 id="strTotalBalance">Total Balance (လက်ကျန်ငွေ)</h2>
            <h1 id="balanceAmount" class="balance-amount">0</h1>
            <div class="income-expense-summary">
                <div class="summary-box income">
                    <i class="fas fa-arrow-down"></i>
                    <div>
                        <p id="strIncome">ဝင်ငွေ</p>
                        <h3 id="totalIncome">+0</h3>
                    </div>
                </div>
                <div class="summary-box expense">
                    <i class="fas fa-arrow-up"></i>
                    <div>
                        <p id="strExpense">ထွက်ငွေ</p>
                        <h3 id="totalExpense">-0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="radio-group">
                <input type="radio" id="typeIncome" name="transactionType" value="income" checked>
                <label for="typeIncome" id="strRadioIncome" class="radio-label income-label">ဝင်ငွေ (+)</label>
                
                <input type="radio" id="typeExpense" name="transactionType" value="expense">
                <label for="typeExpense" id="strRadioExpense" class="radio-label expense-label">ထွက်ငွေ (-)</label>
            </div>
            <div class="input-group">
                <input type="text" id="noteInput" placeholder="Note / အကြောင်းအရာ">
                <input type="number" id="amountInput" placeholder="Amount / ငွေပမာဏ">
                <div class="date-picker-wrapper">
                    <i class="fas fa-calendar-alt calendar-icon"></i>
                    <input type="date" id="dateInput">
                </div>
            </div>
            <button id="addBtn" class="btn-primary"><i class="fas fa-plus"></i> <span id="strAddBtn">Add Record</span></button>
        </div>

        <div class="list-section">
            <h3 id="strTransactionList">Transaction List / စာရင်းများ</h3>
            <div id="transactionList" class="transaction-list">
                </div>
        </div>
    </div>

    <div class="container debt-app">
        <h2 id="debtMotivation" contenteditable="true" class="editable-text debt-motivation">အကြွေးကင်းရင် စိတ်ချမ်းသာတယ်! မြန်မြန်ဆပ်ကြစို့။</h2>
        <div class="balance-card debt-card">
            <h3 id="strTotalDebt">စုစုပေါင်း ပေးရန်အကြွေး</h3>
            <h1 id="totalDebtAmount" class="debt-amount">0</h1>
        </div>

        <div class="input-section debt-input">
            <div class="radio-group">
                <input type="radio" id="debtBorrow" name="debtType" value="borrow" checked>
                <label for="debtBorrow" id="strRadioBorrow" class="radio-label borrow-label">ယူထားသောငွေ</label>
                
                <input type="radio" id="debtRepay" name="debtType" value="repay">
                <label for="debtRepay" id="strRadioRepay" class="radio-label repay-label">ပြန်ဆပ်ငွေ</label>
            </div>
            <div class="input-group compact-group">
                <input type="text" id="debtNameInput" placeholder="Name / အမည်">
                <input type="number" id="debtAmountInput" placeholder="Amount / ငွေပမာဏ">
            </div>
            <button id="addDebtBtn" class="btn-secondary"><i class="fas fa-hand-holding-usd"></i> <span id="strAddDebtBtn">စာရင်းသွင်းမည်</span></button>
        </div>

        <div id="debtList" class="transaction-list debt-list">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
